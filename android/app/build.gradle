plugins {
    id 'com.android.application'
}

android {
    namespace 'com.camscanner.webstudiopro'
    compileSdk 34

    defaultConfig {
        applicationId "com.camscanner.webstudiopro"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "6.82.0"
        setProperty("archivesBaseName", "camlab")
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ""
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

