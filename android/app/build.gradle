plugins {
    id 'com.android.application'
}

android {
    namespace 'com.camlab.studio'
    compileSdk 34

    defaultConfig {
        applicationId "com.camlab.studio"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "6.83.0"
        setProperty("archivesBaseName", "camlab")

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ""
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'tflite', 'lite'
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'

    // Real OpenCV 4.10 Native C++ Computer Vision Engine (Canny, Contour Quad, WarpPerspective, AdaptiveThreshold)
    implementation 'org.opencv:opencv:4.10.0'

    // Bundled Offline Neural AI Models (ML Kit TFLite)
    implementation 'com.google.mlkit:face-detection:16.1.7'
    implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta6'
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // Native CameraX Libraries
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.guava:listenablefuture:1.0'
}
