name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDK_MGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1 || true)
          if [ -n "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses > /dev/null 2>&1 || true
            "$SDK_MGR" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          fi

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build Debug APK (Standalone Offline WebView App)
        run: gradle -p android assembleDebug --no-daemon

      - name: Prepare Release APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk camlab.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: camlab-APK
          path: camlab.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: camlab v6.81.0 (Android APK)
          body: |
            অফলাইন Android APK — ক্যামেরা অটো-ক্রপ, পাসপোর্ট ফটো স্টুডিও (A4 প্রিন্ট) ও PDF এক্সপোর্টসহ সরাসরি ফোনে ইনস্টলযোগ্য।
          files: camlab.apk
