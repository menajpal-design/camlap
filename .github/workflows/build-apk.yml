name: Build Native Mobile APK & Desktop EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDK_MGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1 || true)
          if [ -n "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses > /dev/null 2>&1 || true
            "$SDK_MGR" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          fi

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build Native Android APK (Zero WebView)
        run: gradle -p android assembleDebug --no-daemon

      - name: Prepare Release APK
        run: cp android/app/build/outputs/apk/debug/*.apk camlab.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: camlab-APK
          path: camlab.apk

  build-desktop:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Standalone Native Windows Desktop EXE
        run: dotnet publish desktop/CamLabDesktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o desktop/publish

      - name: Prepare Release EXE
        run: Copy-Item desktop/publish/camlab.exe camlab.exe

      - name: Upload Desktop EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: camlab-Windows-EXE
          path: camlab.exe

  publish-release:
    needs: [build-apk, build-desktop]
    runs-on: ubuntu-latest

    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: camlab-APK
          path: release-files

      - name: Download Desktop EXE Artifact
        uses: actions/download-artifact@v4
        with:
          name: camlab-Windows-EXE
          path: release-files

      - name: Publish APK & Desktop EXE to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: camlab v6.82.0 (Native Mobile APK + Windows Desktop EXE)
          body: |
            - **camlab.apk**: ১০০% নেটিভ অফলাইন Android অ্যাপ (WebView ছাড়া — ডকুমেন্ট স্ক্যান, AI পাসপোর্ট ফটো, A4 প্রিন্ট)
            - **camlab.exe**: ১০০% নেটিভ Windows Desktop অ্যাপ (Single-File .EXE — পাসপোর্ট ফটো, A4 প্রিন্ট শিট ও PDF)
          files: |
            release-files/camlab.apk
            release-files/camlab.exe
