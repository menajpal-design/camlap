name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK (Standalone Offline WebView App)
        run: gradle -p android assembleDebug --no-daemon

      - name: Prepare Release APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CamScanner-Pro.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamScanner-Pro-APK
          path: CamScanner-Pro.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CamScanner Pro v6.81.0 (Android APK)
          body: |
            অফলাইন Android APK — ক্যামেরা অটো-ক্রপ, বুক স্ক্যান ও PDF এক্সপোর্টসহ সরাসরি ফোনে ইনস্টলযোগ্য।
          files: CamScanner-Pro.apk

